AWSTemplateFormatVersion: '2010-09-09'
Description: Experiment 6 - Version 1 - S3 bucket and DynamoDB table

Parameters:
  EnvName:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]

Resources:
  AppBucket:
    Type: AWS::S3::Bucket

  AppTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub exp6-table-${EnvName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

Outputs:
  BucketName:
    Value: !Ref AppBucket
  TableName:
    Value: !Ref AppTable